<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HICHAO.CNX | Camera Rental</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- สีแถบสถานะของเครื่อง = สีแถบบนของแอป (สคริปต์ด้านล่างตั้งค่าจริงก่อนวาด)
         ต้องตรงกับ header.h-16 ใน src/index.css ไม่งั้นจะเห็นเป็นแถบสีแปลกปลอมด้านบน -->
    <meta name="theme-color" content="#ffffff" />

    <!-- iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HICHAO.CNX" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- SEO / OG -->
    <meta name="description" content="ระบบจัดการเช่ากล้อง HICHAO.CNX Camera Rental" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- โหลดเฉพาะน้ำหนักที่ใช้จริง: 400 (ปกติ) / 500 (medium) / 600 (semibold) / 700 (bold)
         ตัด 300 ออก — ไม่มี font-light ใช้ในโค้ดเลยแม้แต่ที่เดียว -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Apply saved theme before paint (no flash) -->
    <script>
      try {
        var dark = localStorage.getItem('hc-theme') === 'dark'
        if (dark) document.documentElement.classList.add('dark')
        var tc = document.querySelector('meta[name="theme-color"]')
        if (tc) tc.setAttribute('content', dark ? '#17121f' : '#ffffff')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[SW] registered:', reg.scope))
            .catch(err => console.warn('[SW] registration failed:', err))
        })
      }
    </script>
  </body>
</html>
